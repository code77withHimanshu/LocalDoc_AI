services:
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      - CHROMA_SERVER_HOST=chroma
      - CHROMA_SERVER_PORT=8000
      # Ollama keeps running on the host machine; "host.docker.internal"
      # lets containers reach it without containerizing Ollama itself.
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ai_uploads:/app/uploaded_docs
    depends_on:
      - chroma

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - ai-service

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  chroma_data:
  ai_uploads:
